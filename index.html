<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TKA Bahasa Indonesia</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  background:linear-gradient(135deg,#fff4c2,#dff7ff,#f7ddff);
  color:#26324a;
}

.app{
  max-width:1000px;
  margin:auto;
  padding:25px 18px;
}

.hero,
.question-card,
.result{
  background:rgba(255,255,255,.94);
  border-radius:30px;
  box-shadow:0 15px 40px rgba(0,0,0,.08);
}

.hero{
  text-align:center;
  padding:45px 25px;
}

.mascot{
  font-size:70px;
}

h1{
  font-size:clamp(2rem,6vw,4rem);
  color:#ff5c7a;
  font-weight:900;
  margin:10px 0;
}

.subtitle{
  font-size:1.15rem;
  line-height:1.6;
  margin-bottom:30px;
}

.features{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin:25px 0;
}

.feature{
  padding:20px 10px;
  background:white;
  border-radius:20px;
  box-shadow:0 7px 20px rgba(0,0,0,.06);
  font-weight:bold;
}

.feature span{
  display:block;
  font-size:32px;
  margin-bottom:8px;
}

.start-btn{
  border:0;
  background:linear-gradient(135deg,#ff5c7a,#ff9f43);
  color:white;
  padding:16px 35px;
  border-radius:50px;
  font-size:1.1rem;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

.start-btn:hover{
  transform:translateY(-3px) scale(1.03);
}

.hidden{
  display:none!important;
}

.quiz{
  margin-top:10px;
}

.topbar{
  background:white;
  border-radius:20px;
  padding:15px;
  margin-bottom:15px;
}

.progress-text{
  font-weight:bold;
  margin-bottom:10px;
}

.progress{
  height:12px;
  background:#e8e8e8;
  border-radius:20px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#ff5c7a,#ffca3a);
  transition:.3s;
}

.question-card{
  padding:30px;
}

.question-number{
  color:#ff5c7a;
  font-weight:bold;
  margin-bottom:15px;
}

.category{
  display:inline-block;
  background:#eef0ff;
  color:#6269c9;
  padding:7px 12px;
  border-radius:20px;
  font-size:.85rem;
  font-weight:bold;
  margin-bottom:15px;
}

.stimulus{
  background:#f5f7ff;
  border-left:5px solid #7c83fd;
  padding:20px;
  border-radius:15px;
  line-height:1.75;
  margin-bottom:20px;
  white-space:pre-line;
}

.question-text{
  font-size:1.2rem;
  line-height:1.6;
  font-weight:bold;
  margin-bottom:20px;
}

.options{
  display:grid;
  gap:12px;
}

.option{
  border:3px solid #e8eaf2;
  background:white;
  padding:16px;
  border-radius:17px;
  text-align:left;
  cursor:pointer;
  font-size:1rem;
  transition:.2s;
}

.option:hover{
  border-color:#ff9f43;
  transform:translateX(4px);
}

.option.selected{
  border-color:#ff5c7a;
  background:#fff0f3;
}

.navigation{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:20px;
}

.nav-btn{
  border:0;
  padding:13px 25px;
  border-radius:30px;
  cursor:pointer;
  font-weight:bold;
  background:#26324a;
  color:white;
}

.result{
  text-align:center;
  padding:45px 25px;
}

.result-icon{
  font-size:70px;
}

.score{
  font-size:5rem;
  font-weight:900;
  color:#ff5c7a;
  margin:20px 0;
}

.result-message{
  font-size:1.2rem;
  margin-bottom:25px;
}

.loading{
  text-align:center;
  padding:40px;
}

.spinner{
  font-size:50px;
  animation:spin 1s infinite linear;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.error{
  background:#fff0f0;
  color:#b42318;
  padding:20px;
  border-radius:15px;
  margin-top:20px;
  line-height:1.6;
}

@media(max-width:700px){

  .features{
    grid-template-columns:repeat(2,1fr);
  }

  .question-card{
    padding:20px;
  }

  .navigation{
    flex-direction:column;
  }

  .nav-btn{
    width:100%;
  }

}
</style>
</head>

<body>

<div class="app">

<!-- ================= BERANDA ================= -->

<section id="home" class="hero">

  <div class="mascot">📚🧠✨</div>

  <h1>TKA BAHASA INDONESIA</h1>

  <p class="subtitle">
    Latih kemampuan literasi, pahami teks,
    dan taklukkan soal-soal TKA! 🚀
  </p>

  <div class="features">

    <div class="feature">
      <span>📚</span>
      Bank Soal
    </div>

    <div class="feature">
      <span>🧠</span>
      Literasi
    </div>

    <div class="feature">
      <span>🎯</span>
      Hitung Skor
    </div>

    <div class="feature">
      <span>🏆</span>
      Raih Prestasi
    </div>

  </div>

  <button class="start-btn" onclick="startQuiz()">
    🚀 MULAI LATIHAN
  </button>

  <div id="loadingHome" class="loading hidden">
    <div class="spinner">🔄</div>
    <p>Memuat bank soal...</p>
  </div>

  <div id="errorHome" class="error hidden"></div>

</section>


<!-- ================= QUIZ ================= -->

<section id="quiz" class="quiz hidden">

  <div class="topbar">

    <div id="progressText" class="progress-text">
      Soal 1
    </div>

    <div class="progress">
      <div id="progressFill" class="progress-fill"></div>
    </div>

  </div>


  <div class="question-card">

    <div id="questionNumber" class="question-number">
      SOAL 1
    </div>

    <div id="category" class="category">
      Bahasa Indonesia
    </div>

    <div id="stimulus" class="stimulus"></div>

    <div id="questionText" class="question-text"></div>

    <div id="options" class="options"></div>

    <div class="navigation">

      <button
        id="previousBtn"
        class="nav-btn"
        onclick="previousQuestion()">
        ← Sebelumnya
      </button>

      <button
        class="nav-btn"
        onclick="nextQuestion()">
        Selanjutnya →
      </button>

    </div>

  </div>

</section>


<!-- ================= HASIL ================= -->

<section id="result" class="result hidden">

  <div class="result-icon">🏆</div>

  <h2>LATIHAN SELESAI!</h2>

  <div id="score" class="score">0</div>

  <div id="resultMessage" class="result-message"></div>

  <button class="start-btn" onclick="startQuiz()">
    🔄 ULANGI LATIHAN
  </button>

</section>

</div>


<script>

/*
==================================================
SUMBER BANK SOAL
==================================================
Google Sheets yang Anda berikan.
==================================================
*/

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRzpZmOAkdsqMY4mncLx1OyIsq1QGYIKUg_Tr9jKT44QUnMh_BDKeS0f95AIOW-FSUS5OTINPtb8bpO/pub?output=csv";


let questions = [];

let currentQuestion = 0;

let userAnswers = [];


/*
==================================================
MEMBACA CSV
==================================================
*/

async function loadQuestions(){

  const response = await fetch(CSV_URL + "&cache=" + Date.now());

  if(!response.ok){
    throw new Error("Bank soal tidak dapat diakses.");
  }

  const csv = await response.text();

  const rows = parseCSV(csv);

  if(rows.length < 2){
    throw new Error("Bank soal masih kosong.");
  }

  const headers = rows[0].map(h =>
    h.trim().toLowerCase()
  );

  const data = rows.slice(1);

  questions = data
    .map(row => {

      const item = {};

      headers.forEach((header,index)=>{
        item[header] = (row[index] || "").trim();
      });

      return item;

    })
    .filter(q =>
      q.soal &&
      q.kunci &&
      q.a &&
      q.b &&
      q.c &&
      q.d
    );

  if(questions.length === 0){
    throw new Error(
      "Tidak ditemukan soal yang lengkap. Periksa kolom Google Sheets."
    );
  }

}


/*
==================================================
CSV PARSER
==================================================
*/

function parseCSV(text){

  const rows = [];

  let row = [];

  let value = "";

  let insideQuotes = false;


  for(let i=0;i<text.length;i++){

    const char = text[i];

    const next = text[i+1];


    if(char === '"' && insideQuotes && next === '"'){

      value += '"';

      i++;

    }

    else if(char === '"'){

      insideQuotes = !insideQuotes;

    }

    else if(char === "," && !insideQuotes){

      row.push(value);

      value = "";

    }

    else if((char === "\n" || char === "\r") && !insideQuotes){

      if(char === "\r" && next === "\n"){
        i++;
      }

      row.push(value);

      value = "";

      if(row.length > 1 || row[0] !== ""){
        rows.push(row);
      }

      row = [];

    }

    else{

      value += char;

    }

  }


  if(value !== "" || row.length > 0){

    row.push(value);

    rows.push(row);

  }


  return rows;
}


/*
==================================================
ACAK ARRAY
==================================================
*/

function shuffle(array){

  const copy = [...array];

  for(let i=copy.length-1;i>0;i--){

    const j =
      Math.floor(Math.random()*(i+1));

    [copy[i],copy[j]] =
      [copy[j],copy[i]];

  }

  return copy;
}


/*
==================================================
MULAI LATIHAN
==================================================
*/

async function startQuiz(){

  const home =
    document.getElementById("home");

  const quiz =
    document.getElementById("quiz");

  const result =
    document.getElementById("result");

  const loading =
    document.getElementById("loadingHome");

  const error =
    document.getElementById("errorHome");


  error.classList.add("hidden");

  result.classList.add("hidden");

  loading.classList.remove("hidden");


  try{

    await loadQuestions();

    /*
    Mengacak seluruh bank soal.
    Untuk sekarang kita mengambil maksimal 20 soal.
    */

    questions =
      shuffle(questions).slice(0,20);


    currentQuestion = 0;

    userAnswers =
      new Array(questions.length).fill(null);


    home.classList.add("hidden");

    loading.classList.add("hidden");

    quiz.classList.remove("hidden");


    showQuestion();

  }

  catch(err){

    loading.classList.add("hidden");

    error.textContent =
      "⚠️ Gagal memuat bank soal: " +
      err.message +
      " Pastikan Google Sheets sudah dipublikasikan sebagai CSV.";

    error.classList.remove("hidden");

  }

}


/*
==================================================
MENAMPILKAN SOAL
==================================================
*/

function showQuestion(){

  const q =
    questions[currentQuestion];


  document.getElementById("questionNumber")
    .textContent =
    "SOAL " + (currentQuestion+1);


  document.getElementById("progressText")
    .textContent =
    "Soal " +
    (currentQuestion+1) +
    " dari " +
    questions.length;


  document.getElementById("progressFill")
    .style.width =
    ((currentQuestion+1) /
    questions.length * 100) +
    "%";


  document.getElementById("category")
    .textContent =
    q.kategori ||
    "Bahasa Indonesia";


  document.getElementById("stimulus")
    .textContent =
    q.stimulus ||
    "Tidak ada stimulus.";


  document.getElementById("questionText")
    .textContent =
    q.soal;


  const optionsContainer =
    document.getElementById("options");


  optionsContainer.innerHTML = "";


  const options = [

    {letter:"A", text:q.a},

    {letter:"B", text:q.b},

    {letter:"C", text:q.c},

    {letter:"D", text:q.d},

    {letter:"E", text:q.e}

  ].filter(option =>
    option.text
  );


  /*
  Acak pilihan jawaban.
  */

  const shuffledOptions =
    shuffle(options);


  shuffledOptions.forEach(option => {

    const button =
      document.createElement("button");


    button.className = "option";


    button.textContent =
      option.letter +
      ". " +
      option.text;


    /*
    Simpan huruf jawaban asli.
    */

    if(userAnswers[currentQuestion] === option.letter){

      button.classList.add("selected");

    }


    button.onclick = function(){

      userAnswers[currentQuestion] =
        option.letter;

      showQuestion();

    };


    optionsContainer.appendChild(button);

  });


  document.getElementById("previousBtn")
    .style.visibility =
    currentQuestion === 0
    ? "hidden"
    : "visible";

}


/*
==================================================
SOAL BERIKUTNYA
==================================================
*/

function nextQuestion(){

  if(userAnswers[currentQuestion] === null){

    alert(
      "Pilih salah satu jawaban terlebih dahulu! 😊"
    );

    return;

  }


  if(currentQuestion <
     questions.length-1){

    currentQuestion++;

    showQuestion();

  }

  else{

    finishQuiz();

  }

}


/*
==================================================
SOAL SEBELUMNYA
==================================================
*/

function previousQuestion(){

  if(currentQuestion > 0){

    currentQuestion--;

    showQuestion();

  }

}


/*
==================================================
SELESAI
==================================================
*/

function finishQuiz(){

  let correct = 0;


  questions.forEach((q,index)=>{

    const key =
      q.kunci
      .trim()
      .toUpperCase();


    if(userAnswers[index] === key){

      correct++;

    }

  });


  const score =
    Math.round(
      (correct/questions.length)*100
    );


  document.getElementById("quiz")
    .classList.add("hidden");


  document.getElementById("result")
    .classList.remove("hidden");


  document.getElementById("score")
    .textContent =
    score;


  let message;


  if(score >= 90){

    message =
      "🌟 Luar biasa! Kemampuan Bahasa Indonesiamu keren banget!";

  }

  else if(score >= 75){

    message =
      "😎 Bagus! Tinggal sedikit lagi menuju nilai sempurna!";

  }

  else if(score >= 60){

    message =
      "💪 Lumayan! Terus berlatih agar semakin jago!";

  }

  else{

    message =
      "📚 Jangan menyerah! Yuk belajar dan coba lagi!";

  }


  document.getElementById("resultMessage")
    .textContent =
    correct +
    " dari " +
    questions.length +
    " jawaban benar. " +
    message;

}

</script>

</body>
</html>
