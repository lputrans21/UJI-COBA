<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TKA Bahasa Indonesia</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  background:linear-gradient(135deg,#fff4c2,#dff7ff,#f7ddff);
  color:#26324a;
}

.app{max-width:1000px;margin:auto;padding:25px 18px}

.hero,.question-card,.result{
  background:rgba(255,255,255,.95);
  border-radius:30px;
  box-shadow:0 15px 40px rgba(0,0,0,.08);
}

.hero{text-align:center;padding:45px 25px}
.mascot{font-size:70px}

h1{
  font-size:clamp(2rem,6vw,4rem);
  color:#ff5c7a;
  font-weight:900;
  margin:10px 0;
}

.subtitle{font-size:1.15rem;line-height:1.6;margin-bottom:30px}

.features{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin:25px 0;
}

.feature{
  padding:20px 10px;
  background:white;
  border-radius:20px;
  box-shadow:0 7px 20px rgba(0,0,0,.06);
  font-weight:bold;
}

.feature span{display:block;font-size:32px;margin-bottom:8px}

.start-btn{
  border:0;
  background:linear-gradient(135deg,#ff5c7a,#ff9f43);
  color:white;
  padding:16px 35px;
  border-radius:50px;
  font-size:1.1rem;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

.start-btn:hover{transform:translateY(-3px) scale(1.03)}
.hidden{display:none!important}

.quiz{margin-top:10px}

.topbar{
  background:white;
  border-radius:20px;
  padding:15px;
  margin-bottom:15px;
}

.progress-text{font-weight:bold;margin-bottom:10px}

.progress{
  height:12px;
  background:#e8e8e8;
  border-radius:20px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#ff5c7a,#ffca3a);
  transition:.3s;
}

.question-card{padding:30px}

.question-number{
  color:#ff5c7a;
  font-weight:bold;
  margin-bottom:15px;
}

.stimulus{
  background:#f5f7ff;
  border-left:5px solid #7c83fd;
  padding:20px;
  border-radius:15px;
  line-height:1.75;
  margin-bottom:20px;
  white-space:pre-line;
}

.question-text{
  font-size:1.2rem;
  line-height:1.6;
  font-weight:bold;
  margin-bottom:20px;
}

.options{display:grid;gap:12px}

/*
  PILIHAN JAWABAN:
  - Tidak menampilkan A/B/C/D/E.
  - Tidak diacak.
  - Hover hanya sedikit mengangkat kotak, TIDAK mengubah warna.
  - Saat diklik, hanya pilihan tersebut yang diberi class selected.
*/
.option{
  display:block;
  width:100%;
  border:3px solid #e8eaf2;
  background:white;
  padding:16px;
  border-radius:17px;
  text-align:left;
  cursor:pointer;
  font-size:1rem;
  line-height:1.5;
  transition:transform .15s ease,border-color .15s ease,background .15s ease;
  color:#26324a;
  font-family:inherit;
}

.option:hover{
  border-color:#d7dbe7;
  background:white;
  transform:translateY(-2px);
}

.option.selected{
  border-color:#7c83fd;
  background:#f1f3ff;
  box-shadow:0 4px 12px rgba(124,131,253,.12);
}

.navigation{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:20px;
}

.nav-btn{
  border:0;
  padding:13px 25px;
  border-radius:30px;
  cursor:pointer;
  font-weight:bold;
  background:#26324a;
  color:white;
}

.result{text-align:center;padding:45px 25px}
.result-icon{font-size:70px}
.score{font-size:5rem;font-weight:900;color:#ff5c7a;margin:20px 0}
.result-message{font-size:1.2rem;margin-bottom:25px}

.loading{text-align:center;padding:40px}
.spinner{font-size:50px;animation:spin 1s infinite linear}

@keyframes spin{to{transform:rotate(360deg)}}

.error{
  background:#fff0f0;
  color:#b42318;
  padding:20px;
  border-radius:15px;
  margin-top:20px;
  line-height:1.6;
}

@media(max-width:700px){
  .features{grid-template-columns:repeat(2,1fr)}
  .question-card{padding:20px}
  .navigation{flex-direction:column}
  .nav-btn{width:100%}
}
</style>
</head>

<body>
<div class="app">

<section id="home" class="hero">
  <div class="mascot">📚🧠✨</div>
  <h1>TKA BAHASA INDONESIA</h1>
  <p class="subtitle">
    Latih kemampuan literasi, pahami teks,<br>
    dan taklukkan soal-soal TKA! 🚀
  </p>

  <div class="features">
    <div class="feature"><span>📚</span>Bank Soal</div>
    <div class="feature"><span>🧠</span>Literasi</div>
    <div class="feature"><span>🎯</span>Hitung Skor</div>
    <div class="feature"><span>🏆</span>Raih Prestasi</div>
  </div>

  <button class="start-btn" onclick="startQuiz()">🚀 MULAI LATIHAN</button>

  <div id="loadingHome" class="loading hidden">
    <div class="spinner">🔄</div>
    <p>Memuat bank soal...</p>
  </div>

  <div id="errorHome" class="error hidden"></div>
</section>

<section id="quiz" class="quiz hidden">
  <div class="topbar">
    <div id="progressText" class="progress-text">Soal 1</div>
    <div class="progress">
      <div id="progressFill" class="progress-fill"></div>
    </div>
  </div>

  <div class="question-card">
    <div id="questionNumber" class="question-number">SOAL 1</div>
    <div id="stimulus" class="stimulus"></div>
    <div id="questionText" class="question-text"></div>
    <div id="options" class="options"></div>

    <div class="navigation">
      <button id="previousBtn" class="nav-btn" onclick="previousQuestion()">
        ← Sebelumnya
      </button>
      <button class="nav-btn" onclick="nextQuestion()">
        Selanjutnya →
      </button>
    </div>
  </div>
</section>

<section id="result" class="result hidden">
  <div class="result-icon">🏆</div>
  <h2>LATIHAN SELESAI!</h2>
  <div id="score" class="score">0</div>
  <div id="resultMessage" class="result-message"></div>
  <button class="start-btn" onclick="startQuiz()">🔄 ULANGI LATIHAN</button>
</section>

</div>

<script>
const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRzpZmOAkdsqMY4mncLx1OyIsq1QGYIKUg_Tr9jKT44QUnMh_BDKeS0f95AIOW-FSUS5OTINPtb8bpO/pub?output=csv";

let questions = [];
let currentQuestion = 0;
let userAnswers = [];

async function loadQuestions(){
  const response = await fetch(CSV_URL + "&cache=" + Date.now());

  if(!response.ok){
    throw new Error("Bank soal tidak dapat diakses.");
  }

  const csv = await response.text();
  const rows = parseCSV(csv);

  if(rows.length < 2){
    throw new Error("Bank soal masih kosong.");
  }

  const headers = rows[0].map(h => h.trim().toLowerCase());

  questions = rows.slice(1)
    .map(row => {
      const item = {};
      headers.forEach((header,index) => {
        item[header] = (row[index] || "").trim();
      });
      return item;
    })
    .filter(q =>
      q.soal &&
      q.kunci &&
      q.a &&
      q.b &&
      q.c &&
      q.d
    );

  if(questions.length === 0){
    throw new Error(
      "Tidak ditemukan soal yang lengkap. Periksa kolom Google Sheets."
    );
  }
}

function parseCSV(text){
  const rows = [];
  let row = [];
  let value = "";
  let insideQuotes = false;

  for(let i=0;i<text.length;i++){
    const char = text[i];
    const next = text[i+1];

    if(char === '"' && insideQuotes && next === '"'){
      value += '"';
      i++;
    }
    else if(char === '"'){
      insideQuotes = !insideQuotes;
    }
    else if(char === "," && !insideQuotes){
      row.push(value);
      value = "";
    }
    else if((char === "\n" || char === "\r") && !insideQuotes){
      if(char === "\r" && next === "\n") i++;

      row.push(value);
      value = "";

      if(row.length > 1 || row[0] !== ""){
        rows.push(row);
      }

      row = [];
    }
    else{
      value += char;
    }
  }

  if(value !== "" || row.length > 0){
    row.push(value);
    rows.push(row);
  }

  return rows;
}

async function startQuiz(){
  const home = document.getElementById("home");
  const quiz = document.getElementById("quiz");
  const result = document.getElementById("result");
  const loading = document.getElementById("loadingHome");
  const error = document.getElementById("errorHome");

  error.classList.add("hidden");
  result.classList.add("hidden");
  loading.classList.remove("hidden");

  try{
    await loadQuestions();

    currentQuestion = 0;
    userAnswers = new Array(questions.length).fill(null);

    home.classList.add("hidden");
    loading.classList.add("hidden");
    quiz.classList.remove("hidden");

    showQuestion();
  }
  catch(err){
    loading.classList.add("hidden");
    error.textContent =
      "⚠️ Gagal memuat bank soal: " +
      err.message +
      " Pastikan Google Sheets sudah dipublikasikan sebagai CSV.";
    error.classList.remove("hidden");
  }
}

function showQuestion(){
  const q = questions[currentQuestion];

  document.getElementById("questionNumber").textContent =
    "SOAL " + (currentQuestion + 1);

  document.getElementById("progressText").textContent =
    "Soal " + (currentQuestion + 1) +
    " dari " + questions.length;

  document.getElementById("progressFill").style.width =
    ((currentQuestion + 1) / questions.length * 100) + "%";

  const stimulus = document.getElementById("stimulus");
  stimulus.textContent = q.stimulus || "";
  stimulus.style.display = q.stimulus ? "block" : "none";

  document.getElementById("questionText").textContent = q.soal;

  const optionsContainer = document.getElementById("options");
  optionsContainer.innerHTML = "";

  /*
    PENTING:
    Posisi pilihan mengikuti kolom A, B, C, D, E
    di Google Sheets. Tidak diacak.
  */
  const options = [
    { text:q.a, index:0 },
    { text:q.b, index:1 },
    { text:q.c, index:2 },
    { text:q.d, index:3 },
    { text:q.e, index:4 }
  ].filter(item => item.text && item.text.trim() !== "");

  options.forEach(item => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "option";
    button.textContent = item.text;

    /*
      Hanya pilihan yang memang tersimpan
      sebagai jawaban pengguna yang diberi selected.
    */
    if(userAnswers[currentQuestion] === item.index){
      button.classList.add("selected");
    }

    /*
      Jangan memanggil showQuestion() saat klik.
      Cukup ubah pilihan yang aktif pada halaman.
      Ini mencegah pilihan pertama ikut menyala.
    */
    button.addEventListener("click", () => {
      userAnswers[currentQuestion] = item.index;

      optionsContainer.querySelectorAll(".option").forEach(option => {
        option.classList.remove("selected");
      });

      button.classList.add("selected");
    });

    optionsContainer.appendChild(button);
  });

  document.getElementById("previousBtn").style.visibility =
    currentQuestion === 0 ? "hidden" : "visible";
}

function nextQuestion(){
  if(userAnswers[currentQuestion] === null){
    alert("Pilih salah satu jawaban terlebih dahulu! 😊");
    return;
  }

  if(currentQuestion < questions.length - 1){
    currentQuestion++;
    showQuestion();
  }
  else{
    finishQuiz();
  }
}

function previousQuestion(){
  if(currentQuestion > 0){
    currentQuestion--;
    showQuestion();
  }
}

function finishQuiz(){
  let correct = 0;

  questions.forEach((q,index) => {
    const key = q.kunci.trim().toUpperCase();

    const keyIndex = {
      A:0,
      B:1,
      C:2,
      D:3,
      E:4
    }[key];

    if(userAnswers[index] === keyIndex){
      correct++;
    }
  });

  const score = Math.round((correct / questions.length) * 100);

  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");
  document.getElementById("score").textContent = score;

  let message;

  if(score >= 90){
    message = "🌟 Luar biasa! Kemampuan Bahasa Indonesiamu keren banget!";
  }
  else if(score >= 75){
    message = "😎 Bagus! Tinggal sedikit lagi menuju nilai sempurna!";
  }
  else if(score >= 60){
    message = "💪 Lumayan! Terus berlatih agar semakin jago!";
  }
  else{
    message = "📚 Jangan menyerah! Yuk belajar dan coba lagi!";
  }

  document.getElementById("resultMessage").textContent =
    correct + " dari " + questions.length +
    " jawaban benar. " + message;
}
</script>
</body>
</html>
