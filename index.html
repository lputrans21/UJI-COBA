<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TKA Bahasa Indonesia</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #fff8d9, #e8f5ff, #f3e5ff);
        color: #18243a;
        min-height: 100vh;
    }

    .container {
        width: min(1000px, 94%);
        margin: 30px auto;
        background: rgba(255,255,255,.94);
        border-radius: 28px;
        padding: 30px;
        box-shadow: 0 12px 35px rgba(0,0,0,.10);
    }

    .header {
        text-align: center;
        margin-bottom: 25px;
    }

    .header h1 {
        margin: 0;
        font-size: 34px;
        color: #3949ab;
    }

    .header p {
        color: #65748b;
        margin-top: 8px;
    }

    .progress {
        height: 10px;
        background: #e7eaf2;
        border-radius: 20px;
        overflow: hidden;
        margin-bottom: 25px;
    }

    .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #6c63ff, #00bcd4);
        transition: width .3s ease;
    }

    .question-label {
        display: inline-block;
        background: #eef0ff;
        color: #5364c7;
        padding: 10px 18px;
        border-radius: 30px;
        font-weight: bold;
        margin-bottom: 18px;
    }

    .stimulus {
        background: #f4f6ff;
        border-left: 6px solid #7278ff;
        border-radius: 20px;
        padding: 25px;
        font-size: 19px;
        line-height: 1.8;
        margin-bottom: 28px;
    }

    .question {
        font-size: 23px;
        font-weight: bold;
        margin-bottom: 20px;
    }

    .options {
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .option {
        width: 100%;
        border: 3px solid #e6e9f2;
        background: white;
        border-radius: 20px;
        padding: 19px 22px;
        font-size: 18px;
        text-align: left;
        cursor: pointer;
        transition: .2s;
    }

    .option:hover {
        transform: translateY(-2px);
        border-color: #8790ff;
        background: #f8f8ff;
    }

    .option.selected {
        border-color: #5964e8;
        background: #eef0ff;
    }

    .option.correct {
        border-color: #2eaf68;
        background: #e8fff1;
    }

    .option.wrong {
        border-color: #e35d6a;
        background: #fff0f2;
    }

    .bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 30px;
        gap: 15px;
    }

    button.next {
        border: none;
        background: #263550;
        color: white;
        padding: 15px 28px;
        border-radius: 30px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }

    button.next:hover {
        background: #394a70;
    }

    button.next:disabled {
        opacity: .5;
        cursor: not-allowed;
    }

    .loading,
    .error,
    .result {
        text-align: center;
        padding: 50px 20px;
    }

    .loading {
        font-size: 20px;
    }

    .result h2 {
        font-size: 32px;
        color: #4b55c9;
    }

    .score {
        font-size: 50px;
        font-weight: bold;
        margin: 20px 0;
    }

    .restart {
        border: none;
        background: #5964e8;
        color: white;
        padding: 15px 28px;
        border-radius: 30px;
        font-weight: bold;
        cursor: pointer;
    }

    @media(max-width:600px) {
        .container {
            padding: 20px;
            margin: 15px auto;
        }

        .header h1 {
            font-size: 27px;
        }

        .stimulus {
            font-size: 17px;
        }

        .question {
            font-size: 20px;
        }

        .option {
            font-size: 16px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📚 TKA Bahasa Indonesia</h1>
        <p>Latihan soal untuk mengasah kemampuanmu!</p>
    </div>

    <div id="app">
        <div class="loading">
            ⏳ Memuat soal...
        </div>
    </div>

</div>

<script>

/* =========================================================
   SUMBER DATA GOOGLE SHEETS
   ========================================================= */

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRzpZmOAkdsqMY4mncLx1OyIsq1QGYIKUg_Tr9jKT44QUnMh_BDKeS0f95AIOW-FSUS5OTINPtb8bpO/pub?output=csv";


/* =========================================================
   VARIABEL APLIKASI
   ========================================================= */

let questions = [];
let currentQuestion = 0;
let score = 0;
let selectedAnswer = null;


/* =========================================================
   FUNGSI MEMBERSIHKAN LABEL A/B/C/D/E
   ========================================================= */

function cleanOption(text) {

    if (!text) return "";

    text = String(text).trim();

    /*
       Menghapus:
       A.
       B.
       C.
       D.
       E.
       A)
       B)
       C)
       D)
       E)
    */

    text = text.replace(
        /^\s*[A-Ea-e]\s*[\.\)]\s*/,
        ""
    );

    return text.trim();
}


/* =========================================================
   CSV PARSER SEDERHANA
   ========================================================= */

function parseCSV(text) {

    const rows = [];
    let row = [];
    let cell = "";
    let insideQuotes = false;

    for (let i = 0; i < text.length; i++) {

        const char = text[i];
        const next = text[i + 1];

        if (char === '"' && insideQuotes && next === '"') {
            cell += '"';
            i++;
        }

        else if (char === '"') {
            insideQuotes = !insideQuotes;
        }

        else if (char === ',' && !insideQuotes) {
            row.push(cell);
            cell = "";
        }

        else if (
            (char === '\n' || char === '\r') &&
            !insideQuotes
        ) {

            if (char === '\r' && next === '\n') {
                i++;
            }

            row.push(cell);
            rows.push(row);

            row = [];
            cell = "";
        }

        else {
            cell += char;
        }
    }

    if (cell !== "" || row.length > 0) {
        row.push(cell);
        rows.push(row);
    }

    return rows;
}


/* =========================================================
   MENGACAK ARRAY
   ========================================================= */

function shuffle(array) {

    const arr = [...array];

    for (let i = arr.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [arr[i], arr[j]] = [arr[j], arr[i]];
    }

    return arr;
}


/* =========================================================
   NORMALISASI NAMA KOLOM
   ========================================================= */

function normalize(text) {

    return String(text || "")
        .toLowerCase()
        .trim()
        .replace(/\s+/g, " ");
}


/* =========================================================
   MEMBACA DATA GOOGLE SHEETS
   ========================================================= */

async function loadQuestions() {

    try {

        const response = await fetch(CSV_URL + "&t=" + Date.now());

        if (!response.ok) {
            throw new Error("Gagal mengambil data.");
        }

        const csvText = await response.text();

        const rows = parseCSV(csvText);

        if (rows.length < 2) {
            throw new Error("Data soal tidak ditemukan.");
        }

        const headers = rows[0].map(normalize);

        console.log("Kolom Google Sheets:", headers);

        /*
           Mencari kolom berdasarkan beberapa kemungkinan nama.
        */

        const findColumn = (...names) => {

            for (const name of names) {

                const index = headers.indexOf(normalize(name));

                if (index !== -1) {
                    return index;
                }
            }

            return -1;
        };


        const questionIndex = findColumn(
            "soal",
            "pertanyaan",
            "question"
        );

        const stimulusIndex = findColumn(
            "stimulus",
            "teks",
            "bacaan",
            "wacana",
            "paragraf"
        );

        const optionAIndex = findColumn(
            "a",
            "opsi a",
            "jawaban a"
        );

        const optionBIndex = findColumn(
            "b",
            "opsi b",
            "jawaban b"
        );

        const optionCIndex = findColumn(
            "c",
            "opsi c",
            "jawaban c"
        );

        const optionDIndex = findColumn(
            "d",
            "opsi d",
            "jawaban d"
        );

        const optionEIndex = findColumn(
            "e",
            "opsi e",
            "jawaban e"
        );

        const answerIndex = findColumn(
            "kunci",
            "jawaban benar",
            "jawaban",
            "answer",
            "correct answer"
        );


        if (questionIndex === -1) {

            throw new Error(
                "Kolom soal tidak ditemukan. Pastikan ada kolom bernama 'Soal'."
            );
        }


        if (
            optionAIndex === -1 ||
            optionBIndex === -1 ||
            optionCIndex === -1 ||
            optionDIndex === -1
        ) {

            throw new Error(
                "Kolom pilihan A-D tidak ditemukan."
            );
        }


        questions = [];


        for (let i = 1; i < rows.length; i++) {

            const row = rows[i];

            const question = String(
                row[questionIndex] || ""
            ).trim();

            if (!question) continue;


            const options = [

                {
                    text: cleanOption(row[optionAIndex]),
                    original: "A"
                },

                {
                    text: cleanOption(row[optionBIndex]),
                    original: "B"
                },

                {
                    text: cleanOption(row[optionCIndex]),
                    original: "C"
                },

                {
                    text: cleanOption(row[optionDIndex]),
                    original: "D"
                }
            ];


            if (optionEIndex !== -1) {

                const eText = cleanOption(row[optionEIndex]);

                if (eText) {

                    options.push({
                        text: eText,
                        original: "E"
                    });
                }
            }


            /*
               Buang pilihan kosong.
            */

            const validOptions = options.filter(
                option => option.text
            );


            /*
               Kunci jawaban.
            */

            let correctAnswer = "";

            if (answerIndex !== -1) {

                correctAnswer = String(
                    row[answerIndex] || ""
                ).trim();

                /*
                   Jika kunci berisi A/B/C/D/E,
                   ubah menjadi isi jawaban.
                */

                const letterMatch =
                    correctAnswer.match(/^[A-Ea-e]$/);

                if (letterMatch) {

                    const found = validOptions.find(
                        option =>
                            option.original.toUpperCase() ===
                            correctAnswer.toUpperCase()
                    );

                    if (found) {
                        correctAnswer = found.text;
                    }
                }

                else {

                    correctAnswer =
                        cleanOption(correctAnswer);
                }
            }


            /*
               Simpan soal.
            */

            questions.push({

                stimulus:
                    stimulusIndex !== -1
                    ? String(row[stimulusIndex] || "").trim()
                    : "",

                question: question,

                options: validOptions,

                correctAnswer: correctAnswer

            });
        }


        if (questions.length === 0) {

            throw new Error(
                "Tidak ada soal yang berhasil dibaca."
            );
        }


        /*
           Acak urutan soal.
        */

        questions = shuffle(questions);


        showQuestion();

    }

    catch (error) {

        console.error(error);

        document.getElementById("app").innerHTML = `

            <div class="error">

                <h2>😕 Oops!</h2>

                <p>
                    Soal belum dapat dimuat.
                </p>

                <p style="color:#777">
                    ${error.message}
                </p>

                <button class="restart"
                    onclick="location.reload()">
                    🔄 Coba Lagi
                </button>

            </div>

        `;
    }
}


/* =========================================================
   MENAMPILKAN SOAL
   ========================================================= */

function showQuestion() {

    selectedAnswer = null;

    const q = questions[currentQuestion];

    /*
       Acak pilihan untuk soal ini.
    */

    const shuffledOptions = shuffle(q.options);


    /*
       Simpan pilihan hasil acak agar
       tombol dapat memeriksa jawaban.
    */

    q.displayOptions = shuffledOptions;


    const progress =
        ((currentQuestion) / questions.length) * 100;


    document.getElementById("app").innerHTML = `

        <div class="progress">

            <div class="progress-bar"
                style="width:${progress}%">
            </div>

        </div>


        <div class="question-label">

            Soal ${currentQuestion + 1}
            dari ${questions.length}

        </div>


        ${
            q.stimulus
            ?
            `
            <div class="stimulus">

                ${q.stimulus}

            </div>
            `
            :
            ""
        }


        <div class="question">

            ${q.question}

        </div>


        <div class="options">

            ${q.displayOptions.map((option, index) => `

                <button
                    class="option"
                    id="option-${index}"
                    onclick="selectAnswer(${index})">

                    ${option.text}

                </button>

            `).join("")}

        </div>


        <div class="bottom">

            <span id="feedback"></span>

            <button
                class="next"
                id="nextButton"
                onclick="nextQuestion()"
                disabled>

                ${
                    currentQuestion === questions.length - 1
                    ? "Selesai ✓"
                    : "Selanjutnya →"
                }

            </button>

        </div>
    `;
}


/* =========================================================
   MEMILIH JAWABAN
   ========================================================= */

function selectAnswer(index) {

    if (selectedAnswer !== null) return;

    selectedAnswer = index;

    const q = questions[currentQuestion];

    const selected = q.displayOptions[index];

    const buttons =
        document.querySelectorAll(".option");


    /*
       Tandai pilihan yang dipilih.
    */

    buttons[index].classList.add("selected");


    /*
       Tentukan benar/salah.
    */

    const isCorrect =
        normalize(selected.text) ===
        normalize(q.correctAnswer);


    if (isCorrect) {

        buttons[index].classList.remove("selected");

        buttons[index].classList.add("correct");

        score++;

        document.getElementById("feedback").innerHTML =
            "🎉 Benar!";

    }

    else {

        buttons[index].classList.remove("selected");

        buttons[index].classList.add("wrong");

        document.getElementById("feedback").innerHTML =
            "💡 Belum tepat.";

        /*
           Tampilkan jawaban benar.
        */

        const correctIndex =
            q.displayOptions.findIndex(
                option =>
                    normalize(option.text) ===
                    normalize(q.correctAnswer)
            );


        if (correctIndex !== -1) {

            buttons[correctIndex]
                .classList.add("correct");
        }
    }


    document.getElementById("nextButton")
        .disabled = false;
}


/* =========================================================
   SOAL BERIKUTNYA
   ========================================================= */

function nextQuestion() {

    if (selectedAnswer === null) return;


    currentQuestion++;


    if (currentQuestion >= questions.length) {

        showResult();

        return;
    }


    showQuestion();
}


/* =========================================================
   HASIL AKHIR
   ========================================================= */

function showResult() {

    const percentage =
        Math.round(
            (score / questions.length) * 100
        );


    document.getElementById("app").innerHTML = `

        <div class="result">

            <h2>🎊 Latihan Selesai!</h2>

            <p>Kamu sudah menyelesaikan semua soal.</p>

            <div class="score">

                ${score} / ${questions.length}

            </div>

            <p>
                Nilai: <strong>${percentage}</strong>
            </p>

            <br>

            <button
                class="restart"
                onclick="restartQuiz()">

                🔄 Kerjakan Lagi

            </button>

        </div>
    `;
}


/* =========================================================
   ULANGI LATIHAN
   ========================================================= */

function restartQuiz() {

    currentQuestion = 0;
    score = 0;
    selectedAnswer = null;

    questions = shuffle(questions);

    showQuestion();
}


/* =========================================================
   MULAI APLIKASI
   ========================================================= */

loadQuestions();

</script>

</body>
</html>
