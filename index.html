<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TKA Bahasa Indonesia</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #fff4c2, #dff7ff, #f7ddff);
      color: #25304a;
    }

    .app {
      max-width: 1000px;
      margin: auto;
      padding: 30px 20px;
    }

    .hero {
      background: rgba(255,255,255,0.9);
      border-radius: 30px;
      padding: 45px 30px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.08);
    }

    .mascot {
      font-size: 80px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: clamp(2.2rem, 6vw, 4.5rem);
      font-weight: 900;
      color: #ff5c7a;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 1.3rem;
      margin-bottom: 30px;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin: 30px 0;
    }

    .feature {
      background: #fff;
      border-radius: 20px;
      padding: 20px 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
      font-weight: bold;
    }

    .feature span {
      display: block;
      font-size: 32px;
      margin-bottom: 8px;
    }

    .start-btn {
      border: none;
      background: linear-gradient(135deg, #ff5c7a, #ff9f43);
      color: white;
      padding: 17px 40px;
      border-radius: 50px;
      font-size: 1.15rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255,92,122,0.3);
      transition: 0.2s;
    }

    .start-btn:hover {
      transform: translateY(-3px) scale(1.03);
    }

    .hidden {
      display: none;
    }

    .quiz {
      margin-top: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      gap: 15px;
    }

    .progress-box {
      flex: 1;
      background: white;
      border-radius: 20px;
      padding: 12px;
    }

    .progress {
      height: 12px;
      background: #e8e8e8;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff5c7a, #ffca3a);
      transition: width 0.3s;
    }

    .question-card {
      background: white;
      border-radius: 28px;
      padding: 30px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
    }

    .question-number {
      color: #ff5c7a;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .stimulus {
      background: #f5f7ff;
      border-left: 5px solid #7c83fd;
      padding: 20px;
      border-radius: 15px;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .question-text {
      font-size: 1.2rem;
      line-height: 1.6;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .options {
      display: grid;
      gap: 12px;
    }

    .option {
      border: 3px solid #e8eaf2;
      background: white;
      padding: 16px;
      border-radius: 17px;
      text-align: left;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.2s;
    }

    .option:hover {
      border-color: #ff9f43;
      transform: translateX(4px);
    }

    .option.selected {
      border-color: #ff5c7a;
      background: #fff0f3;
    }

    .navigation {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      gap: 10px;
    }

    .nav-btn {
      border: none;
      padding: 13px 25px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      background: #25304a;
      color: white;
    }

    .result {
      background: white;
      border-radius: 30px;
      padding: 45px 30px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.08);
    }

    .score {
      font-size: 5rem;
      font-weight: 900;
      color: #ff5c7a;
      margin: 20px 0;
    }

    .result-message {
      font-size: 1.3rem;
      margin-bottom: 25px;
    }

    @media (max-width: 700px) {
      .features {
        grid-template-columns: repeat(2, 1fr);
      }

      .question-card {
        padding: 20px;
      }

      .topbar {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- BERANDA -->
  <section id="home" class="hero">
    <div class="mascot">📚🧠✨</div>

    <h1>TKA BAHASA INDONESIA</h1>

    <p class="subtitle">
      Yuk, uji kemampuanmu dan taklukkan soal-soal Bahasa Indonesia! 🚀
    </p>

    <div class="features">
      <div class="feature">
        <span>📚</span>
        Latihan Soal
      </div>

      <div class="feature">
        <span>🧠</span>
        Uji Literasi
      </div>

      <div class="feature">
        <span>🎯</span>
        Hitung Skor
      </div>

      <div class="feature">
        <span>🏆</span>
        Raih Nilai Terbaik
      </div>
    </div>

    <button class="start-btn" onclick="startQuiz()">
      🚀 MULAI LATIHAN
    </button>
  </section>


  <!-- QUIZ -->
  <section id="quiz" class="quiz hidden">

    <div class="topbar">
      <div class="progress-box">
        <strong id="progressText">Soal 1 dari 5</strong>
        <div class="progress">
          <div id="progressFill" class="progress-fill"></div>
        </div>
      </div>
    </div>

    <div class="question-card">

      <div id="questionNumber" class="question-number">
        SOAL 1
      </div>

      <div id="stimulus" class="stimulus"></div>

      <div id="questionText" class="question-text"></div>

      <div id="options" class="options"></div>

      <div class="navigation">
        <button class="nav-btn" onclick="previousQuestion()">
          ← Sebelumnya
        </button>

        <button class="nav-btn" onclick="nextQuestion()">
          Selanjutnya →
        </button>
      </div>

    </div>
  </section>


  <!-- HASIL -->
  <section id="result" class="result hidden">

    <div style="font-size:70px;">🏆</div>

    <h2>LATIHAN SELESAI!</h2>

    <div id="score" class="score">0</div>

    <div id="resultMessage" class="result-message"></div>

    <button class="start-btn" onclick="startQuiz()">
      🔄 ULANGI LATIHAN
    </button>

  </section>

</div>


<script>

const questions = [
  {
    stimulus:
      "Membaca merupakan salah satu kegiatan yang dapat memperluas wawasan. Dengan membaca, seseorang dapat memperoleh berbagai informasi, memahami sudut pandang baru, dan meningkatkan kemampuan berpikir kritis. Oleh karena itu, kebiasaan membaca perlu ditanamkan sejak dini.",

    question:
      "Apa gagasan utama paragraf tersebut?",

    options: [
      "Membaca dapat memperluas wawasan seseorang.",
      "Membaca harus dilakukan sejak usia dewasa.",
      "Kemampuan berpikir kritis hanya diperoleh melalui membaca.",
      "Informasi hanya dapat diperoleh melalui buku.",
      "Membaca merupakan kegiatan yang sulit dilakukan."
    ],

    answer: 0
  },

  {
    stimulus:
      "Penggunaan transportasi umum dapat memberikan berbagai manfaat bagi masyarakat. Selain mengurangi jumlah kendaraan pribadi di jalan raya, transportasi umum juga dapat membantu mengurangi kemacetan dan polusi udara.",

    question:
      "Informasi yang sesuai dengan paragraf tersebut adalah ...",

    options: [
      "Transportasi umum selalu menyebabkan kemacetan.",
      "Transportasi umum dapat membantu mengurangi polusi.",
      "Kendaraan pribadi tidak menghasilkan polusi.",
      "Masyarakat dilarang menggunakan kendaraan pribadi.",
      "Transportasi umum hanya digunakan di kota besar."
    ],

    answer: 1
  },

  {
    stimulus:
      "Sekolah yang memiliki lingkungan bersih dapat menciptakan suasana belajar yang lebih nyaman. Kebersihan lingkungan sekolah juga dapat membantu mencegah berbagai penyakit. Oleh sebab itu, seluruh warga sekolah perlu menjaga kebersihan lingkungan bersama-sama.",

    question:
      "Simpulan yang tepat berdasarkan paragraf tersebut adalah ...",

    options: [
      "Kebersihan sekolah hanya menjadi tanggung jawab petugas kebersihan.",
      "Lingkungan sekolah tidak berhubungan dengan kegiatan belajar.",
      "Kebersihan sekolah penting dan perlu dijaga bersama.",
      "Penyakit hanya dapat dicegah dengan membersihkan sekolah.",
      "Siswa tidak perlu ikut menjaga kebersihan sekolah."
    ],

    answer: 2
  },

  {
    stimulus:
      "Kemajuan teknologi memberikan banyak kemudahan dalam kehidupan sehari-hari. Namun, penggunaan teknologi yang tidak bijaksana dapat menimbulkan berbagai masalah. Karena itu, masyarakat perlu menggunakan teknologi secara bertanggung jawab.",

    question:
      "Sikap yang paling tepat berdasarkan isi paragraf adalah ...",

    options: [
      "Menghindari semua bentuk teknologi.",
      "Menggunakan teknologi tanpa batas.",
      "Menggunakan teknologi secara bertanggung jawab.",
      "Menolak perkembangan teknologi.",
      "Menggunakan teknologi hanya untuk hiburan."
    ],

    answer: 2
  },

  {
    stimulus:
      "Berolahraga secara teratur dapat membantu menjaga kebugaran tubuh. Aktivitas fisik juga dapat meningkatkan stamina dan membuat tubuh menjadi lebih sehat. Kebiasaan tersebut sebaiknya dilakukan secara rutin sesuai kemampuan masing-masing.",

    question:
      "Apa tujuan penulis menyampaikan paragraf tersebut?",

    options: [
      "Mengajak pembaca untuk berolahraga secara teratur.",
      "Menjelaskan sejarah olahraga.",
      "Membandingkan berbagai jenis olahraga.",
      "Melarang aktivitas fisik.",
      "Menjelaskan cara membuat alat olahraga."
    ],

    answer: 0
  }
];

let currentQuestion = 0;
let userAnswers = [];

function startQuiz() {
  currentQuestion = 0;
  userAnswers = new Array(questions.length).fill(null);

  document.getElementById("home").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");

  showQuestion();
}

function showQuestion() {

  const q = questions[currentQuestion];

  document.getElementById("questionNumber").textContent =
    "SOAL " + (currentQuestion + 1);

  document.getElementById("progressText").textContent =
    "Soal " + (currentQuestion + 1) +
    " dari " + questions.length;

  document.getElementById("progressFill").style.width =
    ((currentQuestion + 1) / questions.length * 100) + "%";

  document.getElementById("stimulus").textContent = q.stimulus;

  document.getElementById("questionText").textContent = q.question;

  const optionsContainer = document.getElementById("options");

  optionsContainer.innerHTML = "";

  q.options.forEach((option, index) => {

    const button = document.createElement("button");

    button.className = "option";

    button.textContent =
      String.fromCharCode(65 + index) + ". " + option;

    if (userAnswers[currentQuestion] === index) {
      button.classList.add("selected");
    }

    button.onclick = function() {
      userAnswers[currentQuestion] = index;
      showQuestion();
    };

    optionsContainer.appendChild(button);

  });
}

function nextQuestion() {

  if (userAnswers[currentQuestion] === null) {
    alert("Pilih salah satu jawaban terlebih dahulu! 😊");
    return;
  }

  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    showQuestion();
  } else {
    finishQuiz();
  }
}

function previousQuestion() {

  if (currentQuestion > 0) {
    currentQuestion--;
    showQuestion();
  }

}

function finishQuiz() {

  let correct = 0;

  questions.forEach((question, index) => {

    if (userAnswers[index] === question.answer) {
      correct++;
    }

  });

  const score =
    Math.round((correct / questions.length) * 100);

  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");

  document.getElementById("score").textContent =
    score;

  let message = "";

  if (score >= 90) {
    message = "🌟 Luar biasa! Kemampuan Bahasa Indonesiamu keren banget!";
  } else if (score >= 75) {
    message = "😎 Bagus! Tinggal sedikit lagi menuju nilai sempurna!";
  } else if (score >= 60) {
    message = "💪 Lumayan! Terus berlatih agar semakin jago!";
  } else {
    message = "📚 Jangan menyerah! Yuk, belajar dan coba lagi!";
  }

  document.getElementById("resultMessage").textContent =
    message;
}

</script>

</body>
</html>
